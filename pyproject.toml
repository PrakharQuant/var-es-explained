[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "var-es-explained"
version = "0.1.0"
description = "Educational library and tutorial for VaR and Expected Shortfall"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Prakhar", email = "bestofprakhar@gmail.com"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
